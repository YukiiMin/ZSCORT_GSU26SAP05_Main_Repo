<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 68" fill="none">
  <defs>
    <!-- Gradient for Local System Node (Sapphire Blue) -->
    <linearGradient id="scortBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070F2" />
      <stop offset="100%" stop-color="#0040B0" />
    </linearGradient>
    <!-- Gradient for Target System Node (Electric Cyan) -->
    <linearGradient id="scortCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <!-- Gradient for Text Accent -->
    <linearGradient id="scortAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F2" />
      <stop offset="100%" stop-color="#00D2D3" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE (Left) -->
  <g transform="translate(6, 6)">
    <!-- Base Rounded Container -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0F1D2F" />
    <rect x="1" y="1" width="54" height="54" rx="13" stroke="url(#scortAccentGrad)" stroke-width="1.5" fill="none" opacity="0.75" />

    <!-- Left Local Node -->
    <path d="M14 18 C14 15 16 14 19 14 L26 14 C27 14 28 15 28 16 L28 40 C28 41 27 42 26 42 L19 42 C16 42 14 41 14 38 Z" fill="url(#scortBlueGrad)" />
    
    <!-- Right Target Node -->
    <path d="M30 16 C30 15 31 14 32 14 L39 14 C42 14 44 15 44 18 L44 38 C44 41 42 42 39 42 L32 42 C31 42 30 41 30 40 Z" fill="url(#scortCyanGrad)" />

    <!-- Center Compare / Replication Bridge (Dynamic Arrows) -->
    <path d="M21 24 L35 24 M31 20 L36 24 L31 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 32 L21 32 M25 28 L20 32 L25 36" stroke="#00D2D3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Active Pulse Dots -->
    <circle cx="28" cy="18" r="1.8" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="28" cy="38" r="1.8" fill="#00D2D3" filter="url(#softGlow)" />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(74, 0)">
    <!-- Brand Title: SCORT -->
    <text x="0" y="35" font-family="'72', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#1C2D42">
      SC<tspan fill="url(#scortAccentGrad)">O</tspan>RT
    </text>
    
    <!-- SAP System Badge Pill -->
    <rect x="142" y="17" width="92" height="18" rx="4" fill="#0070F2" fill-opacity="0.12" />
    <text x="188" y="30" font-family="'72', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#0070F2" text-anchor="middle">
      SAP05 • S40
    </text>

    <!-- Subtitle: SAP Cross-system Object Replication Toolkit -->
    <text x="0" y="52" font-family="'72', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.6" fill="#556B82">
      SAP CROSS-SYSTEM OBJECT REPLICATION TOOLKIT
    </text>
  </g>
</svg>
